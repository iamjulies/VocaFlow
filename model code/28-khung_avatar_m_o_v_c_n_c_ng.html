<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khung Avatar Mèo & Cún Cưng</title>
  <style>
    /* */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #12141a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      padding: 24px;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 36px;
      color: #e2e8f0;
    }

    /* */
    .showcase-container {
      display: flex;
      gap: 50px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .avatar-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    /* Vỏ bọc avatar kích thước chuẩn */
    .avatar-box {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ảnh đại diện tròn bên trong */
    .avatar-img {
      width: 106px;
      height: 106px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #232733;
      border: 3px solid #181b22;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    /* Khung SVG phủ lên trên ảnh */
    .frame-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: visible;
      transition: transform 0.3s ease;
    }

    .label {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: color 0.3s ease;
    }

    /* */
    /* Hiệu ứng nhún nhẹ khi hover cho bé Mèo */
    .avatar-card.cat:hover .avatar-img {
      transform: scale(1.04);
    }
    .avatar-card.cat:hover .cat-ear-left {
      transform-origin: 32px 30px;
      animation: wiggleLeft 0.5s ease-in-out;
    }
    .avatar-card.cat:hover .cat-ear-right {
      transform-origin: 98px 30px;
      animation: wiggleRight 0.5s ease-in-out;
    }
    .avatar-card.cat:hover .label {
      color: #ff9fb2;
    }

    /* Hiệu ứng vẫy tai nhẹ cho bé Cún */
    .avatar-card.dog:hover .avatar-img {
      transform: scale(1.04);
    }
    .avatar-card.dog:hover .dog-ear-left {
      transform-origin: 24px 34px;
      animation: flopEar 0.6s ease-in-out;
    }
    .avatar-card.dog:hover .dog-ear-right {
      transform-origin: 106px 34px;
      animation: flopEarRev 0.6s ease-in-out;
    }
    .avatar-card.dog:hover .label {
      color: #f5b041;
    }

    @keyframes wiggleLeft {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-8deg); }
      70% { transform: rotate(5deg); }
    }

    @keyframes wiggleRight {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(8deg); }
      70% { transform: rotate(-5deg); }
    }

    @keyframes flopEar {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg) translateY(2px); }
    }

    @keyframes flopEarRev {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg) translateY(2px); }
    }
  </style>
</head>
<body>

  <h2>Khung Avatar Thú Cưng Đơn Giản</h2>

  <div class="showcase-container">

    <!-- -->
    <!-- 1. KHUNG VIỀN MÈO (CAT FRAME) -->
    <div class="avatar-card cat">
      <div class="avatar-box">
        <!-- Ảnh Avatar -->
        <img class="avatar-img" 
             src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&auto=format&fit=crop&q=80" 
             alt="Cat Avatar"
             onerror="this.src='https://placehold.co/106x106/2d1f2d/ff9fb2?text=Cat'">

        <!-- SVG Viền Mèo: Tai vểnh + Vòng bo hồng cam pastel + Chuông vàng nhỏ -->
        <svg class="frame-svg" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Vòng bo viền tròn mảnh -->
          <circle cx="65" cy="65" r="54" stroke="#ff9fb2" stroke-width="4.5" />
          <circle cx="65" cy="65" r="50" stroke="#ffd1dc" stroke-width="1.5" opacity="0.6" />

          <!-- Tai Mèo Trái -->
          <g class="cat-ear-left">
            <polygon points="22,46 32,15 50,33" fill="#ff9fb2" stroke="#ff758f" stroke-width="2" stroke-linejoin="round" />
            <polygon points="27,42 34,22 46,34" fill="#ffe0e6" />
          </g>

          <!-- Tai Mèo Phải -->
          <g class="cat-ear-right">
            <polygon points="108,46 98,15 80,33" fill="#ff9fb2" stroke="#ff758f" stroke-width="2" stroke-linejoin="round" />
            <polygon points="103,42 96,22 84,34" fill="#ffe0e6" />
          </g>

          <!-- Chuông nhỏ dễ thương ở đáy khung -->
          <g transform="translate(65, 117)">
            <!-- Nơ / Đệm chuông -->
            <ellipse cx="0" cy="-2" rx="11" ry="4" fill="#ff758f" />
            <!-- Quả chuông vàng -->
            <circle cx="0" cy="1" r="7" fill="#facc15" stroke="#eab308" stroke-width="1.2" />
            <line x1="-4" y1="2" x2="4" y2="2" stroke="#ca8a04" stroke-width="1" />
            <circle cx="0" cy="4" r="1.3" fill="#854d0e" />
          </g>
        </svg>
      </div>
      <span class="label" style="color: #ffb3c1;">Bé Mèo Dễ Thương</span>
    </div>

    <!-- -->
    <!-- 2. KHUNG VIỀN CÚN (DOG FRAME) -->
    <div class="avatar-card dog">
      <div class="avatar-box">
        <!-- Ảnh Avatar -->
        <img class="avatar-img" 
             src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200&auto=format&fit=crop&q=80" 
             alt="Dog Avatar"
             onerror="this.src='https://placehold.co/106x106/2b2216/f5b041?text=Dog'">

        <!-- SVG Viền Cún: Tai cụp nâu vàng ấm áp + Khúc xương nhỏ dưới đáy -->
        <svg class="frame-svg" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Vòng bo viền tròn màu nâu vàng caramel -->
          <circle cx="65" cy="65" r="54" stroke="#f5b041" stroke-width="4.5" />
          <circle cx="65" cy="65" r="50" stroke="#fdebd0" stroke-width="1.5" opacity="0.5" />

          <!-- Tai Cún Cụp Bên Trái -->
          <g class="dog-ear-left">
            <path d="M 28,26 C 20,28 14,40 15,55 C 16,66 25,68 29,62 C 34,54 36,36 32,27 Z" 
                  fill="#d35400" stroke="#ba4a00" stroke-width="2" stroke-linejoin="round" />
            <path d="M 25,32 C 21,38 19,48 21,57 C 23,61 27,61 28,56 C 30,50 31,38 28,33 Z" 
                  fill="#e59866" opacity="0.6" />
          </g>

          <!-- Tai Cún Cụp Bên Phải -->
          <g class="dog-ear-right">
            <path d="M 102,26 C 110,28 116,40 115,55 C 114,66 105,68 101,62 C 96,54 94,36 98,27 Z" 
                  fill="#d35400" stroke="#ba4a00" stroke-width="2" stroke-linejoin="round" />
            <path d="M 105,32 C 109,38 111,48 109,57 C 107,61 103,61 102,56 C 100,50 99,38 102,33 Z" 
                  fill="#e59866" opacity="0.6" />
          </g>

          <!-- Khúc xương nhỏ xinh ở đáy khung -->
          <g transform="translate(65, 118)">
            <!-- Thân xương -->
            <rect x="-8" y="-3.5" width="16" height="7" rx="3.5" fill="#fdfefe" stroke="#e5e7eb" stroke-width="1" />
            <!-- Khớp xương 2 đầu -->
            <circle cx="-8" cy="-3.5" r="3" fill="#fdfefe" stroke="#e5e7eb" stroke-width="0.8" />
            <circle cx="-8" cy="3.5" r="3" fill="#fdfefe" stroke="#e5e7eb" stroke-width="0.8" />
            <circle cx="8" cy="-3.5" r="3" fill="#fdfefe" stroke="#e5e7eb" stroke-width="0.8" />
            <circle cx="8" cy="3.5" r="3" fill="#fdfefe" stroke="#e5e7eb" stroke-width="0.8" />
          </g>
        </svg>
      </div>
      <span class="label" style="color: #f8c471;">Bé Cún Tinh Nghịch</span>
    </div>

  </div>

</body>
</html>
