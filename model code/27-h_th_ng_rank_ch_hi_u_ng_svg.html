<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Rank Chữ Kèm Hiệu Ứng SVG</title>
  
  <style>
    /* Cấu hình nền tối chung để hiển thị hiệu ứng đẹp nhất */
    body {
      background-color: #0d0e12;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(255, 0, 127, 0.05) 0%, transparent 60%),
        radial-gradient(circle at 50% 80%, rgba(0, 210, 255, 0.05) 0%, transparent 60%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .rank-container {
      display: flex;
      flex-direction: column;
      gap: 28px;
      background: #18191f;
      padding: 45px 55px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      min-width: 320px;
    }

    /* Khung bao bọc từng rank để định vị SVG tuyệt đối */
    .rank-row {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .username {
      position: relative;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-align: center;
      transition: all 0.3s ease;
      z-index: 2;
    }

    /* =======================================================
       1. CẤP ĐỒNG (BRONZE) - Đơn giản, mộc mạc, không có hover
       ======================================================= */
    .rank-bronze-row {
      cursor: default;
    }
    .tier-bronze {
      color: #cd7f32;
      text-shadow: 0 0 6px rgba(205, 127, 50, 0.45);
      cursor: default;
    }

    /* =======================================================
       2. CẤP BẠC (SILVER) - Ánh kim kim loại, lấp lánh nhẹ khi hover
       ======================================================= */
    .tier-silver {
      color: #e0e0e0;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3), 0 0 15px rgba(224, 224, 224, 0.2);
    }
    .tier-silver:hover {
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 25px rgba(200, 220, 255, 0.5);
      transform: scale(1.03);
    }

    /* =======================================================
       3. CẤP VÀNG (GOLD) - Ánh hoàng kim + SVG Lấp Lánh Blink Blink (✨)
       ======================================================= */
    .tier-gold {
      background: linear-gradient(90deg, #ffd700 0%, #fff8dc 50%, #ffd700 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldShine 3s linear infinite;
      filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.45));
    }
    .tier-gold:hover {
      filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.95));
      transform: scale(1.03);
    }
    @keyframes goldShine {
      to { background-position: 200% center; }
    }

    /* SVG Lấp Lánh Blink Blink (✨) vừa khít khổ chữ */
    .gold-svg-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 230px;
      height: 44px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .gold-sparkle {
      transform-origin: center;
      animation: goldTwinkle 2.2s ease-in-out infinite;
    }

    @keyframes goldTwinkle {
      0%, 100% {
        transform: scale(0.1) rotate(0deg);
        opacity: 0;
      }
      50% {
        transform: scale(1) rotate(45deg);
        opacity: 1;
      }
    }

    /* Nhịp nhấp nháy so le tinh tế */
    .gold-sparkle-1 { animation-delay: 0.1s; }
    .gold-sparkle-2 { animation-delay: 0.7s; }
    .gold-sparkle-3 { animation-delay: 1.3s; }
    .gold-sparkle-4 { animation-delay: 1.8s; }

    .rank-gold-row:hover .gold-sparkle {
      animation-duration: 1.2s;
    }

    /* =======================================================
       4. CẤP KIM CƯƠNG (DIAMOND) - Neon xanh băng + SVG Lấp Lánh
       ======================================================= */
    .tier-diamond {
      color: #b9f2ff;
      text-shadow: 0 0 6px #00d2ff, 0 0 16px rgba(0, 210, 255, 0.6);
      animation: diamondPulse 2s ease-in-out infinite alternate;
    }
    @keyframes diamondPulse {
      from { text-shadow: 0 0 6px #00d2ff, 0 0 16px rgba(0, 210, 255, 0.6); }
      to { text-shadow: 0 0 12px #00e5ff, 0 0 28px #00d2ff, 0 0 35px rgba(0, 210, 255, 0.9); }
    }

    /* SVG lấp lánh kim cương thu gọn phạm vi vừa khít dòng chữ */
    .diamond-svg-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 230px;
      height: 44px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    /* Ẩn lấp lánh mặc định, bung sáng rực rỡ khi hover */
    .diamond-sparkle {
      opacity: 0;
      transform-origin: center;
      transition: opacity 0.25s ease;
    }

    .rank-diamond-row:hover .tier-diamond {
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #00e5ff, 0 0 35px #00bfff;
      transform: scale(1.04);
    }

    .rank-diamond-row:hover .diamond-sparkle {
      opacity: 1;
    }

    /* Hiệu ứng tia lấp lánh xoay & co giãn ngắt quãng tinh tế, gọn gàng */
    @keyframes diamondGlintAnim {
      0% {
        transform: scale(0.15) rotate(0deg);
        opacity: 0;
      }
      50% {
        transform: scale(0.85) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: scale(0.35) rotate(90deg);
        opacity: 0.2;
      }
    }

    /* Tia quét chéo phản quang kim cương - chuẩn chiều cao chữ và lướt trọn vẹn */
    @keyframes diamondLightSweep {
      0% { transform: translateX(-35px) skewX(-20deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateX(240px) skewX(-20deg); opacity: 0; }
    }

    .rank-diamond-row:hover .sparkle-1 {
      animation: diamondGlintAnim 1s ease-in-out infinite 0.05s;
    }
    .rank-diamond-row:hover .sparkle-2 {
      animation: diamondGlintAnim 1.2s ease-in-out infinite 0.35s;
    }
    .rank-diamond-row:hover .sparkle-3 {
      animation: diamondGlintAnim 0.9s ease-in-out infinite 0.2s;
    }
    .rank-diamond-row:hover .sparkle-4 {
      animation: diamondGlintAnim 1.1s ease-in-out infinite 0.5s;
    }
    .rank-diamond-row:hover .sparkle-5 {
      animation: diamondGlintAnim 1s ease-in-out infinite 0.7s;
    }
    .rank-diamond-row:hover .diamond-sweep-beam {
      animation: diamondLightSweep 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* =======================================================
       5. CẤP HUYỀN THOẠI (LEGENDARY) - Cyberpunk + SVG Làn Lửa Hồng Quét Phía Sau
       ======================================================= */
    .tier-legendary {
      position: relative;
      background: linear-gradient(45deg, #ff007f, #ff66b2, #ff007f);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldShine 2s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255, 0, 127, 0.7));
      z-index: 2;
    }

    /* Hiệu ứng Glitch huyền thoại khi hover */
    .tier-legendary::before,
    .tier-legendary::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: transparent;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: none;
      z-index: 2;
    }
    .rank-legendary-row:hover .tier-legendary::before {
      display: block;
      left: 2px;
      background: linear-gradient(45deg, #00ffff, #ff007f);
      -webkit-background-clip: text;
      text-shadow: -1px 0 #00ffff;
      clip: rect(10px, 9999px, 30px, 0);
      animation: glitch-anim 0.3s infinite linear alternate-reverse;
    }
    .rank-legendary-row:hover .tier-legendary::after {
      display: block;
      left: -2px;
      background: linear-gradient(45deg, #ff007f, #ffff00);
      -webkit-background-clip: text;
      text-shadow: 1px 0 #ffff00;
      clip: rect(25px, 9999px, 45px, 0);
      animation: glitch-anim2 0.3s infinite linear alternate-reverse;
    }
    @keyframes glitch-anim {
      0% { clip: rect(15px, 9999px, 20px, 0); }
      100% { clip: rect(5px, 9999px, 35px, 0); }
    }
    @keyframes glitch-anim2 {
      0% { clip: rect(25px, 9999px, 40px, 0); }
      100% { clip: rect(12px, 9999px, 28px, 0); }
    }

    /* SVG Làn Lửa Hồng Quét Qua - Đặt ở lớp nền phía sau dòng chữ (z-index: 1) */
    .legendary-flame-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 80px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      border-radius: 12px;
    }

    .flame-wave-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* Khi hover vào hàng Huyền Thoại: Kích hoạt ngọn lửa quét mượt mà phía sau */
    .rank-legendary-row:hover .flame-wave-svg {
      opacity: 0.95;
    }

    .rank-legendary-row:hover .tier-legendary {
      transform: scale(1.05);
      filter: drop-shadow(0 0 14px rgba(255, 0, 127, 0.95)) drop-shadow(0 0 25px rgba(255, 102, 178, 0.8));
    }

    /* Hoạt ảnh làn lửa hồng quét từ trái qua phải */
    @keyframes pinkFlameSweepMotion {
      0% {
        transform: translateX(-120%);
      }
      50% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(120%);
      }
    }

    /* Hoạt ảnh bập bùng ngọn lửa */
    @keyframes flameTongueFlicker {
      0%, 100% {
        transform: scaleY(1) translateY(0);
      }
      50% {
        transform: scaleY(1.18) translateY(-2px);
      }
    }

    .rank-legendary-row:hover .flame-sweep-group {
      animation: pinkFlameSweepMotion 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .rank-legendary-row:hover .flame-tongues {
      animation: flameTongueFlicker 0.25s ease-in-out infinite alternate;
    }
  </style>
</head>
<body>

  <div class="rank-container">
    
    <!-- Cấp 1: Đồng (Không có hiệu ứng hover) -->
    <div class="rank-row rank-bronze-row">
      <span class="username tier-bronze">Bronze_Player</span>
    </div>
    
    <!-- Cấp 2: Bạc -->
    <div class="rank-row">
      <span class="username tier-silver">Silver_Warrior</span>
    </div>
    
    <!-- Cấp 3: Vàng (Kèm SVG Blink Blink ✨) -->
    <div class="rank-row rank-gold-row">
      <span class="username tier-gold">Gold_Champion</span>

      <!-- SVG Hiệu Ứng Lấp Lánh Vàng (Blink Blink ✨) -->
      <svg class="gold-svg-overlay" viewBox="0 0 230 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Bộ lọc phát sáng ánh kim rực rỡ -->
          <filter id="goldGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.2" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <!-- Gradient màu vàng hoàng kim lấp lánh -->
          <linearGradient id="goldSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="40%" stop-color="#fff099" />
            <stop offset="75%" stop-color="#ffd700" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>

          <!-- Biểu tượng Blink Blink ✨ (Ngôi sao 4 cánh cong chuẩn emoji ✨) -->
          <g id="sparkleStar">
            <!-- Tia sáng phụ 4 hướng chéo nhỏ -->
            <path d="M 0,-3.5 L 0,3.5 M -3.5,0 L 3.5,0" stroke="#fff5b8" stroke-width="0.8" opacity="0.7" transform="rotate(45)" />
            <!-- Cánh sao chính uốn cong concave -->
            <path d="M 0,-7.5 Q 0,0 7.5,0 Q 0,0 0,7.5 Q 0,0 -7.5,0 Q 0,0 0,-7.5 Z" fill="url(#goldSparkleGrad)" filter="url(#goldGlowFilter)" />
            <!-- Tâm sao trắng sáng -->
            <circle cx="0" cy="0" r="1.4" fill="#ffffff" />
          </g>

          <!-- Ngôi sao nhỏ phụ kèm theo tạo hiệu ứng cụm lấp lánh ✨ -->
          <g id="sparkleMini">
            <path d="M 0,-4.5 Q 0,0 4.5,0 Q 0,0 0,4.5 Q 0,0 -4.5,0 Q 0,0 0,-4.5 Z" fill="url(#goldSparkleGrad)" filter="url(#goldGlowFilter)" />
            <circle cx="0" cy="0" r="0.9" fill="#ffffff" />
          </g>
        </defs>

        <!-- Cụm lấp lánh 1: Phía trên chữ G đầu dòng -->
        <g class="gold-sparkle gold-sparkle-1" transform="translate(18, 10)">
          <use href="#sparkleStar" />
        </g>

        <!-- Cụm lấp lánh 2: Nhỏ phụ bên cạnh chữ G (như cặp đôi của emoji ✨) -->
        <g class="gold-sparkle gold-sparkle-2" transform="translate(32, 17) scale(0.65)">
          <use href="#sparkleMini" />
        </g>

        <!-- Cụm lấp lánh 3: Đỉnh chữ C (Champion) ở trung tâm -->
        <g class="gold-sparkle gold-sparkle-3" transform="translate(112, 9) scale(0.9)">
          <use href="#sparkleStar" />
        </g>

        <!-- Cụm lấp lánh 4: Dưới chữ p-i -->
        <g class="gold-sparkle gold-sparkle-1" transform="translate(162, 33) scale(0.7)">
          <use href="#sparkleMini" />
        </g>

        <!-- Cụm lấp lánh 5: Góc trên đuôi chữ n kết thúc -->
        <g class="gold-sparkle gold-sparkle-4" transform="translate(210, 11)">
          <use href="#sparkleStar" />
        </g>

        <!-- Hạt bụi vàng li ti -->
        <circle cx="75" cy="32" r="1.2" fill="#ffd700" class="gold-sparkle gold-sparkle-2" filter="url(#goldGlowFilter)" />
        <circle cx="138" cy="14" r="1.1" fill="#ffffff" class="gold-sparkle gold-sparkle-3" filter="url(#goldGlowFilter)" />
      </svg>
    </div>
    
    <!-- Cấp 4: Kim Cương (Kèm SVG Lấp Lánh Tinh Chỉnh Vừa Vặn Khổ Chữ) -->
    <div class="rank-row rank-diamond-row">
      <span class="username tier-diamond">Diamond_Elite</span>

      <!-- SVG Hiệu Ứng Kim Cương Thu Gọn Tinh Tế -->
      <svg class="diamond-svg-overlay" viewBox="0 0 230 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Bộ lọc phát sáng ngọc neon xanh lơ -->
          <filter id="diamondSparkleFilter" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <!-- Gradient chùm sáng kim cương quét chéo -->
          <linearGradient id="diamondBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
          </linearGradient>

          <!-- Ngôi sao kim cương 4 cánh cong chuẩn giác cắt (thu nhỏ kích thước) -->
          <g id="diamondStarShape">
            <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#ffffff" filter="url(#diamondSparkleFilter)" />
            <circle cx="0" cy="0" r="1.6" fill="#a5f3fc" />
          </g>

          <!-- Tinh thể kim cương nhỏ đa diện vừa vặn nét chữ -->
          <g id="miniDiamondCrystal">
            <polygon points="0,-6 4,-2 3,5 -3,5 -4,-2" fill="#00e5ff" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />
            <polygon points="0,-6 4,-2 0,1" fill="#ffffff" opacity="0.85" />
            <polygon points="0,-6 -4,-2 0,1" fill="#cffafe" opacity="0.65" />
          </g>
        </defs>

        <!-- Dải quét chéo tia sáng ngọc bích lướt chuẩn chiều cao chữ -->
        <g class="diamond-sweep-beam" opacity="0">
          <rect x="0" y="4" width="14" height="36" fill="url(#diamondBeamGrad)" rx="2" />
        </g>

        <!-- Các ngôi sao lấp lánh bố trí ôm sát dòng chữ Diamond_Elite -->
        <!-- 1. Góc trên chữ D -->
        <g class="diamond-sparkle sparkle-1" transform="translate(20, 10)">
          <use href="#diamondStarShape" />
        </g>

        <!-- 2. Thân chữ m-o -->
        <g class="diamond-sparkle sparkle-2" transform="translate(82, 12)">
          <use href="#miniDiamondCrystal" transform="rotate(15)" />
        </g>

        <!-- 3. Đỉnh chữ trung tâm giữa Diamond & Elite -->
        <g class="diamond-sparkle sparkle-3" transform="translate(122, 10)">
          <use href="#diamondStarShape" transform="scale(1.05)" />
        </g>

        <!-- 4. Cuối chữ Elite -->
        <g class="diamond-sparkle sparkle-4" transform="translate(198, 12)">
          <use href="#diamondStarShape" transform="scale(0.9)" />
        </g>

        <!-- 5. Chân chữ dưới -->
        <g class="diamond-sparkle sparkle-5" transform="translate(54, 32)">
          <use href="#diamondStarShape" transform="scale(0.7)" />
        </g>

        <!-- Các đốm tinh thể bụi kim cương nhỏ -->
        <circle cx="156" cy="30" r="1.4" fill="#ffffff" class="diamond-sparkle sparkle-2" filter="url(#diamondSparkleFilter)" />
        <circle cx="178" cy="11" r="1.5" fill="#67e8f9" class="diamond-sparkle sparkle-4" filter="url(#diamondSparkleFilter)" />
      </svg>
    </div>
    
    <!-- Cấp 5: Huyền Thoại (Kèm SVG Làn Lửa Hồng Quét Phía Sau Khi Hover) -->
    <div class="rank-row rank-legendary-row">
      <!-- Container chứa SVG Làn Lửa Hồng Quét Phía Sau (z-index: 1) -->
      <div class="legendary-flame-container">
        <svg class="flame-wave-svg" viewBox="0 0 340 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Gradient màu Lửa Ma Thuật Hồng Neon cực nhiệt -->
            <linearGradient id="mythicPinkFlameGrad" x1="0%" y1="50%" x2="100%" y2="50%">
              <stop offset="0%" stop-color="#ff007f" stop-opacity="0" />
              <stop offset="25%" stop-color="#ff007f" stop-opacity="0.7" />
              <stop offset="50%" stop-color="#ff66b2" stop-opacity="0.95" />
              <stop offset="68%" stop-color="#ffffff" stop-opacity="1" />
              <stop offset="85%" stop-color="#ff007f" stop-opacity="0.85" />
              <stop offset="100%" stop-color="#99004d" stop-opacity="0" />
            </linearGradient>

            <!-- Gradient Lõi Lửa Trắng Hồng Sáng Lóa -->
            <linearGradient id="flameWhiteCoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
              <stop offset="30%" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="50%" stop-color="#ffe6f3" stop-opacity="1" />
              <stop offset="70%" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#ff3399" stop-opacity="0" />
            </linearGradient>

            <!-- Bộ lọc phát sáng quầng lửa hồng huyền ảo -->
            <filter id="flameInfernoGlow" x="-30%" y="-40%" width="160%" height="180%">
              <feGaussianBlur stdDeviation="3.5" result="blur1" />
              <feGaussianBlur stdDeviation="7" result="blur2" />
              <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Nhóm làn lửa quét ngang qua (Animated Group) -->
          <g class="flame-sweep-group">
            
            <!-- Quầng hào quang nền của luồng lửa -->
            <ellipse cx="170" cy="40" rx="90" ry="24" fill="url(#mythicPinkFlameGrad)" filter="url(#flameInfernoGlow)" opacity="0.6" />

            <!-- Lớp ngọn lửa chính với các lưỡi lửa uốn lượn sắc sảo (Flame Tongues) -->
            <g class="flame-tongues" filter="url(#flameInfernoGlow)">
              <path d="M 80,56 
                       C 105,54 118,34 130,22 
                       C 136,36 142,42 152,28 
                       C 160,16 168,8 178,14 
                       C 188,22 190,36 198,24 
                       C 208,12 216,20 224,32 
                       C 234,44 245,48 260,56 
                       C 230,62 205,58 170,60 
                       C 135,62 110,60 80,56 Z" 
                    fill="url(#mythicPinkFlameGrad)" />

              <!-- Lõi lửa trắng hồng cực nhiệt ở giữa dòng quét -->
              <path d="M 115,50 
                       C 132,48 142,32 154,24 
                       C 162,34 166,20 174,16
