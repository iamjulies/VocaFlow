name: vocaflow
description: "VocaFlow - Smart English Vocabulary Memorization App"
publish_to: 'none'
version: 0.10.8+193

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio & Natural TTS Streaming
  just_audio: ^0.9.40
  http: ^1.2.2

  # Firebase Suite (Cloud Sync & Auth)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Utilities
  uuid: ^4.4.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  collection: ^1.18.0

  # File Management & Excel Operations
  excel: ^4.0.6
  file_picker: ^8.1.2
  share_plus: ^10.0.2

  # UI & Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
