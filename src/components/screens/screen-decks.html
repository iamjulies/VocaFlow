    <section id="screen-decks" class="screen active">
      <div class="top-nav">
        <div>
          <h1 class="screen-title" style="margin-bottom: 2px;">Bộ Từ Vựng Của Bạn</h1>
          <p style="font-size: 13px; color: var(--text-muted); margin: 0;">Quản lý và ôn tập các bộ từ thông minh</p>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-outline" onclick="openLibraryModal()" style="border-color: rgba(99, 102, 241, 0.4); color: #a5b4fc; background: rgba(99, 102, 241, 0.1); font-weight: 700;">
            📚 Thư Viện Từ Vựng
          </button>
          <button class="btn btn-primary" onclick="openAiDeckStudioModal()" style="background: linear-gradient(135deg, #a855f7, #6366f1); border: none; font-weight: 700; box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);">
            ✨ Tạo Bằng AI
          </button>
          <button class="btn btn-primary" onclick="openDeckModal()">
            <svg class="icon"><use href="#i-add"/></svg> Thêm Bộ Từ
          </button>
        </div>
      </div>

      <!-- SPACED REPETITION DAILY REVIEW BANNER (v0.0.10.0) -->
      <div id="daily-review-banner-container" style="margin-bottom: 18px;"></div>

      <!-- DECK FILTER TABS WITH LIVE SORT SELECTOR (v0.0.8.14) -->
      <div class="deck-tabs-container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px;">
        <div class="deck-tabs" style="margin-bottom: 0;">
          <button class="deck-tab active" id="tab-active-decks" onclick="setDeckTab('active')">
            <svg class="icon icon-sm"><use href="#i-book"/></svg> <span>Đang học</span> (<span id="count-active-decks">0</span>)
          </button>
          <button class="deck-tab" id="tab-archived-decks" onclick="setDeckTab('archived')">
            <svg class="icon icon-sm"><use href="#i-archive"/></svg> <span>Kho Lưu Trữ</span> (<span id="count-archived-decks">0</span>)
          </button>
        </div>

        <!-- SORT CONTROLS -->
        <div style="display: flex; align-items: center; gap: 6px;">
          <label for="deck-sort-select" style="font-size: 12px; color: var(--text-muted); font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 4px;">
            <span>🔀 Sắp xếp:</span>
          </label>
          <select id="deck-sort-select" class="form-select" onchange="setDeckSort(this.value)" style="padding: 6px 10px; font-size: 12px; height: 34px; border-radius: 8px; background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text); cursor: pointer;">
            <option value="recent">🕒 Cập nhật gần nhất</option>
            <option value="name_asc">🔤 Tên bộ từ (A ➔ Z)</option>
            <option value="name_desc">🔤 Tên bộ từ (Z ➔ A)</option>
            <option value="count_desc">📚 Số lượng từ (Nhiều ➔ Ít)</option>
            <option value="mastery_desc">👑 Mức độ thuộc (Cao ➔ Thấp)</option>
            <option value="created_desc">📅 Ngày tạo mới nhất</option>
          </select>
        </div>
      </div>

      <div class="deck-grid" id="deck-grid">
        <!-- Rendered via JS -->
      </div>

      <!-- ADSENSE MULTIPLEX RECOMMENDATION AD UNIT (v0.10.8-alpha-10.3) -->
      <div id="decks-footer-adsense-multiplex-container" style="margin-top: 28px; padding-top: 18px; border-top: 1px dashed var(--border); text-align: center; overflow: hidden;">
        <div style="font-size: 11px; color: var(--text-muted); text-align: left; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Gợi ý tài trợ dành cho bạn</div>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-format="autorelaxed"
             data-ad-client="ca-pub-1343250003116465"
             data-ad-slot="4211562925"></ins>
      </div>
    </section>
