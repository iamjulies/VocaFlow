<!-- ========================================================================= -->
<!-- MODAL: LEVEL UP CELEBRATION & REWARDS DROP (v0.10.10-39 Build 340) -->
<!-- ========================================================================= -->
<div class="modal-overlay" id="modal-level-up" style="z-index: 10005;">
  <div class="modal modal-level-up-container" style="max-width: 480px; text-align: center; position: relative; overflow: hidden; border: 2px solid rgba(245, 158, 11, 0.5); box-shadow: 0 12px 50px rgba(0,0,0,0.6); padding: 26px 20px;">
    <!-- Canvas for celebratory fireworks -->
    <canvas id="level-up-fireworks-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"></canvas>

    <div style="position: relative; z-index: 1;">
      <!-- TOP CELEBRATION ICON -->
      <div id="level-up-badge-icon" class="level-up-anim-badge" style="font-size: 58px; margin-bottom: 4px; line-height: 1; filter: drop-shadow(0 6px 20px rgba(245, 158, 11, 0.6));">
        🌟
      </div>

      <div style="font-size: 11.5px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #fbbf24; margin-bottom: 2px;">
        ✨ LEVEL UP CELEBRATION ✨
      </div>

      <h2 id="level-up-modal-title" style="font-size: 26px; font-weight: 900; color: #ffffff; margin-bottom: 4px; text-shadow: 0 2px 10px rgba(245, 158, 11, 0.5);">
        CẤP ĐỘ 10
      </h2>

      <div id="level-up-modal-rank-title" style="font-size: 13.5px; font-weight: 700; color: #38bdf8; margin-bottom: 14px;">
        Học Viên Tiên Phong
      </div>

      <!-- MILESTONE BADGE (Visible on Level 10, 20, 30, 40, 50) -->
      <div id="level-up-milestone-banner" style="display: none; background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(236, 72, 153, 0.2)); border: 1px solid rgba(245, 158, 11, 0.45); border-radius: 12px; padding: 8px 12px; margin-bottom: 14px;">
        <span style="font-size: 15px;">👑</span>
        <strong id="level-up-milestone-text" style="font-size: 12px; color: #fde68a;">Cột Mốc Hoàng Gia - Mở Khóa Đặc Quyền VocaVIP!</strong>
      </div>

      <!-- REWARDS DROPS CONTAINER -->
      <div style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 14px; padding: 14px 12px; margin-bottom: 16px;">
        <div style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;">
          🎁 Phần Thưởng Thăng Cấp Đã Nhận
        </div>

        <div id="level-up-rewards-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
          <!-- Dynamically populated via showLevelUpCelebrationModal -->
        </div>
      </div>

      <!-- ACTION BUTTON -->
      <button type="button" class="btn btn-primary" onclick="closeModal('modal-level-up')" style="width: 100%; justify-content: center; background: linear-gradient(135deg, #f59e0b, #d97706); border: none; font-size: 14px; font-weight: 800; padding: 10px 16px; border-radius: 12px; box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35); cursor: pointer;">
        🚀 Nhận Thưởng & Tiếp Tục Học
      </button>
    </div>
  </div>
</div>
