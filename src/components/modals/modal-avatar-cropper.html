<!-- MODAL: AVATAR CROPPER (v0.10.9-44) -->
<div class="modal-overlay sub-modal-overlay" id="modal-avatar-cropper" style="z-index: 10010;">
  <div class="modal" style="max-width: 520px; width: 94vw; max-height: 90vh; display: flex; flex-direction: column; padding: 20px;">
    <div class="modal-title" style="margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 22px;">✂️</span>
        <div>
          <strong style="font-size: 16px; color: var(--text);">Căn Chỉnh & Cắt Ảnh Đại Diện</strong>
          <div style="font-size: 11.5px; color: var(--text-muted); font-weight: normal;">Kéo di chuyển và thu phóng để chọn góc đẹp nhất</div>
        </div>
      </div>
      <button class="btn btn-outline btn-icon" onclick="closeModal('modal-avatar-cropper')"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>

    <!-- CROPPER VIEWPORT CONTAINER -->
    <div style="position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d16; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; padding: 12px; margin-bottom: 14px; user-select: none;">
      <canvas id="avatar-cropper-canvas" width="280" height="280" style="border-radius: 10px; cursor: grab; max-width: 100%; background: #000; touch-action: none;"></canvas>
      <div style="position: absolute; bottom: 18px; left: 18px; background: rgba(15,23,42,0.85); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15); border-radius: 50%; width: 52px; height: 52px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;" title="Xem trước hình tròn">
        <canvas id="avatar-cropper-preview-thumb" width="52" height="52" style="width: 100%; height: 100%; border-radius: 50%;"></canvas>
      </div>
    </div>

    <!-- CONTROLS TOOLBAR -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;">
      <!-- ZOOM SLIDER ROW -->
      <div style="display: flex; align-items: center; gap: 10px; background: var(--surface-elevated); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border);">
        <span style="font-size: 14px;">🔍</span>
        <button type="button" class="btn btn-outline btn-sm btn-icon" onclick="adjustAvatarCropZoom(-0.15)" style="width: 28px; height: 28px; padding: 0; font-size: 15px; font-weight: 700;">-</button>
        <input type="range" id="avatar-crop-zoom-slider" min="0.8" max="3.5" step="0.05" value="1.0" oninput="onAvatarCropZoomInput(this.value)" style="flex: 1; cursor: pointer; accent-color: #6366f1;">
        <button type="button" class="btn btn-outline btn-sm btn-icon" onclick="adjustAvatarCropZoom(0.15)" style="width: 28px; height: 28px; padding: 0; font-size: 15px; font-weight: 700;">+</button>
        <span id="avatar-crop-zoom-label" style="font-size: 12px; font-weight: 700; color: var(--text-muted); min-width: 38px; text-align: right;">1.0x</span>
      </div>

      <!-- ACTION BUTTONS ROW -->
      <div style="display: flex; gap: 8px; justify-content: space-between;">
        <button type="button" class="btn btn-outline btn-sm" onclick="rotateAvatarCrop(90)" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px;">
          <span>🔄</span> <span>Xoay 90°</span>
        </button>
        <button type="button" class="btn btn-outline btn-sm" onclick="resetAvatarCrop()" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px;">
          <span>🎯</span> <span>Căn Giữa</span>
        </button>
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('avatar-file-input').click()" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px;">
          <span>📁</span> <span>Chọn Ảnh Khác</span>
        </button>
      </div>
    </div>

    <!-- MODAL ACTIONS -->
    <div style="display: flex; gap: 10px; margin-top: auto; border-top: 1px solid var(--border); padding-top: 12px;">
      <button type="button" class="btn btn-outline" onclick="closeModal('modal-avatar-cropper')" style="flex: 1;">Hủy</button>
      <button type="button" class="btn btn-primary" onclick="confirmAndApplyCroppedAvatar()" style="flex: 2; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; font-weight: 700; box-shadow: 0 4px 14px rgba(99,102,241,0.35);">
        ✨ Áp Dụng Ảnh Này
      </button>
    </div>
  </div>
</div>
