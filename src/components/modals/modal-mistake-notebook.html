  <!-- MODAL: MISTAKE NOTEBOOK / SỔ TAY LỖI SAI (v0.10.9-37) -->
  <div class="modal-overlay" id="modal-mistake-notebook" style="z-index: 9999;">
    <div class="modal" style="max-width: 780px; max-height: 90vh; display: flex; flex-direction: column;">
      <!-- Title & Header -->
      <div class="modal-title" style="margin-bottom: 12px; flex-shrink: 0;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 22px;">📕</span>
          <div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <strong style="font-size: 16px; color: var(--text);">Sổ Tay Lỗi Sai & Câu Cần Ôn Tập</strong>
              <span id="mistake-notebook-count-badge" class="badge" style="background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); font-size: 11px; font-weight: 800; padding: 2px 8px;">0 từ</span>
            </div>
            <div style="font-size: 11.5px; color: var(--text-muted); font-weight: normal;">Tự động lưu trữ các câu bạn làm sai trong bài để ôn tập lại cho đến khi nhớ sâu</div>
          </div>
        </div>
        <button class="btn btn-outline btn-icon" onclick="closeModal('modal-mistake-notebook')"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>

      <!-- Quick Action Buttons: 1-Click Launch Review -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; flex-shrink: 0;" id="mistake-notebook-actions-bar">
        <button class="btn btn-primary" id="btn-mistake-quiz" onclick="startMistakeReviewSession('quiz')" style="background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; font-weight: 700; font-size: 12.5px; padding: 9px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 10px rgba(99,102,241,0.3);">
          <svg class="icon icon-sm"><use href="#i-quiz"/></svg> <span id="label-mistake-quiz">🎯 Ôn Trắc Nghiệm</span>
        </button>
        <button class="btn btn-primary" id="btn-mistake-spelling" onclick="startMistakeReviewSession('spelling')" style="background: linear-gradient(135deg, #f59e0b, #d97706); border: none; font-weight: 700; font-size: 12.5px; padding: 9px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 10px rgba(245,158,11,0.3);">
          <svg class="icon icon-sm"><use href="#i-edit"/></svg> <span id="label-mistake-spelling">✍️ Luyện Viết</span>
        </button>
        <button class="btn btn-primary" id="btn-mistake-speaking" onclick="startMistakeReviewSession('speaking')" style="background: linear-gradient(135deg, #ec4899, #db2777); border: none; font-weight: 700; font-size: 12.5px; padding: 9px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 10px rgba(236,72,153,0.3);">
          <svg class="icon icon-sm"><use href="#i-mic"/></svg> <span id="label-mistake-speaking">🎙️ Luyện Nói</span>
        </button>
        <button class="btn btn-outline" onclick="clearAllMistakeWords()" style="border-color: rgba(239, 68, 68, 0.4); color: #f87171; background: rgba(239, 68, 68, 0.08); font-weight: 700; font-size: 12px; padding: 9px 10px;" title="Xóa toàn bộ các từ đã lưu trong sổ tay">
          <span>🗑️</span> <span>Xóa Sổ Tay</span>
        </button>
      </div>

      <!-- Filters Bar -->
      <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; flex-shrink: 0;">
        <input type="text" id="mistake-notebook-search" class="form-input" placeholder="🔍 Tìm từ vựng sai hoặc nghĩa..." oninput="onMistakeNotebookSearch(this.value)" style="flex: 1; min-width: 150px; height: 32px; font-size: 12px; padding: 4px 10px; border-radius: 8px;">
        
        <select id="mistake-notebook-deck-filter" class="form-select" onchange="onMistakeNotebookDeckFilterChange(this.value)" style="width: auto; height: 32px; font-size: 11.5px; padding: 0 8px; border-radius: 8px;" title="Lọc theo VocaDeck">
          <option value="all">📁 Tất cả VocaDeck</option>
        </select>

        <select id="mistake-notebook-mode-filter" class="form-select" onchange="onMistakeNotebookModeFilterChange(this.value)" style="width: auto; height: 32px; font-size: 11.5px; padding: 0 8px; border-radius: 8px;" title="Lọc theo Chế độ làm sai">
          <option value="all">🏷️ Tất cả chế độ</option>
          <option value="quiz">🎯 Trắc nghiệm</option>
          <option value="spelling">✍️ Luyện viết</option>
          <option value="speaking">🎙️ Luyện nói</option>
        </select>
      </div>

      <!-- List Content Container -->
      <div id="mistake-notebook-list-container" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; min-height: 200px;">
        <!-- Injected via renderMistakeNotebookList() -->
      </div>

      <!-- Footer Actions -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); flex-shrink: 0;">
        <div style="font-size: 11.5px; color: var(--text-muted);" id="mistake-notebook-footer-info">
          💡 Khi bạn ôn tập lại và trả lời đúng, từ vựng sẽ tự động được gỡ bỏ khỏi Sổ Tay Lỗi Sai.
        </div>
        <button class="btn btn-outline btn-sm" onclick="closeModal('modal-mistake-notebook')">Đóng</button>
      </div>
    </div>
  </div>
