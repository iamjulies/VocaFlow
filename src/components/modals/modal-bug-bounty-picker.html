  <div class="modal-overlay" id="modal-bug-bounty-picker" style="z-index: 10025;">
    <div class="modal" style="max-width: 520px; width: 95vw; max-height: 90vh; display: flex; flex-direction: column;">
      <div class="modal-title">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 24px;">🎁</span>
          <div>
            <strong style="font-size: 15.5px; color: var(--text);">Trao Thưởng Bắt Lỗi (Bug Bounty)</strong>
            <div id="bounty-modal-subtitle" style="font-size: 11px; color: var(--text-muted); font-weight: normal;">Tùy chỉnh phần thưởng trao tặng cho học viên</div>
          </div>
        </div>
        <button class="btn btn-outline btn-icon" onclick="closeModal('modal-bug-bounty-picker')"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>

      <div style="flex: 1; overflow-y: auto; padding-right: 2px;">
        <!-- REPORTER & BUG INFO CARD WITH CLICKABLE VIP PROFILE LINK -->
        <div style="background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;">
          <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 3px;">Học viên nhận thưởng:</div>
          <div id="bounty-reporter-info" style="font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
            👤 Loading...
          </div>
          <div id="bounty-report-title" style="font-size: 11.5px; color: #a5b4fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">🐛 Báo cáo: ...</div>
        </div>

        <!-- 1. CHỌN LOẠI PHẦN THƯỞNG -->
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label" style="font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px;">1. Chọn loại phần thưởng:</label>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px;" id="bounty-type-selector">
            <button type="button" class="btn btn-outline btn-sm bounty-type-btn" id="bounty-btn-coins" onclick="selectBountyType('coins')" style="flex-direction: column; padding: 8px 4px; gap: 3px; font-size: 11px; border-radius: 8px; border-color: #6366f1; background: rgba(99,102,241,0.2); color: #fff;">
              <span style="font-size: 18px;">🪙</span>
              <span style="font-weight: 700;">Tiền Xu</span>
            </button>
            <button type="button" class="btn btn-outline btn-sm bounty-type-btn" id="bounty-btn-hints" onclick="selectBountyType('hints')" style="flex-direction: column; padding: 8px 4px; gap: 3px; font-size: 11px; border-radius: 8px;">
              <span style="font-size: 18px;">💡</span>
              <span style="font-weight: 700;">Gợi Ý AI</span>
            </button>
            <button type="button" class="btn btn-outline btn-sm bounty-type-btn" id="bounty-btn-skips" onclick="selectBountyType('skips')" style="flex-direction: column; padding: 8px 4px; gap: 3px; font-size: 11px; border-radius: 8px;">
              <span style="font-size: 18px;">⏭️</span>
              <span style="font-weight: 700;">Thẻ Bỏ Qua</span>
            </button>
            <button type="button" class="btn btn-outline btn-sm bounty-type-btn" id="bounty-btn-spins" onclick="selectBountyType('spins')" style="flex-direction: column; padding: 8px 4px; gap: 3px; font-size: 11px; border-radius: 8px;">
              <span style="font-size: 18px;">🎡</span>
              <span style="font-weight: 700;">Lượt Quay</span>
            </button>
            <button type="button" class="btn btn-outline btn-sm bounty-type-btn" id="bounty-btn-vip" onclick="selectBountyType('vip')" style="flex-direction: column; padding: 8px 4px; gap: 3px; font-size: 11px; border-radius: 8px;">
              <span style="font-size: 18px;">👑</span>
              <span style="font-weight: 700;">Ngày VIP</span>
            </button>
          </div>
        </div>

        <!-- 2. SỐ LƯỢNG THƯỞNG -->
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label" style="font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px;">2. Số lượng trao tặng:</label>
          <div id="bounty-presets-container" style="display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;"></div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="number" id="bounty-custom-amount" class="form-input" min="1" max="10000" value="50" style="font-size: 14px; font-weight: 700; color: #38bdf8;" oninput="updateBountyPreview()">
            <span id="bounty-unit-label" style="font-size: 12px; color: var(--text-muted); font-weight: 600; min-width: 60px;">Xu</span>
          </div>
        </div>

        <!-- 3. LỜI NHẮN KÈM THEO -->
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label" style="font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 4px;">3. Lời nhắn / Lý do trao thưởng:</label>
          <input type="text" id="bounty-custom-note" class="form-input" placeholder="Cảm ơn bạn đã phát hiện và đóng góp báo cáo sự cố!" value="Cảm ơn bạn đã phát hiện và đóng góp báo cáo sự cố cho VocaFlow!" style="font-size: 12.5px;">
        </div>

        <!-- PREVIEW SUMMARY BANNER -->
        <div id="bounty-summary-banner" style="background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--text); line-height: 1.5; margin-bottom: 10px;">
          🎁 Phần thưởng sẽ trao: <strong id="bounty-preview-text" style="color: #fbbf24;">+50 Xu</strong>
        </div>
      </div>

      <div class="modal-actions" style="margin-top: 10px; display: flex; gap: 8px; justify-content: flex-end;">
        <button type="button" class="btn btn-outline" onclick="closeModal('modal-bug-bounty-picker')">Hủy</button>
        <button type="button" id="btn-confirm-bounty" class="btn btn-primary" onclick="confirmSendCustomBugBounty()" style="background: linear-gradient(135deg, #f59e0b, #ec4899); border: none; font-weight: 700; padding: 8px 18px;">
          🚀 Xác Nhận Trao Thưởng
        </button>
      </div>
    </div>
  </div>
