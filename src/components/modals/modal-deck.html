  <div class="modal-overlay" id="modal-deck">
    <div class="modal">
      <div class="modal-title">
        <span id="modal-deck-title">Tạo Bộ Từ Mới</span>
        <button class="btn btn-outline btn-icon" onclick="closeModal('modal-deck')"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>

      <form id="deck-form" onsubmit="saveDeckForm(event)">
        <input type="hidden" id="deck-id">
        <div class="form-group">
          <label class="form-label">Tên bộ từ *</label>
          <input type="text" id="deck-title" class="form-input" placeholder="Ví dụ: IELTS Band 7.0+, TOEIC 600..." required>
        </div>
        <div class="form-group">
          <label class="form-label">Mô tả</label>
          <textarea id="deck-desc" class="form-textarea" rows="2" placeholder="Ghi chú mục tiêu hoặc chủ đề..."></textarea>
        </div>
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" style="margin-bottom: 0; font-weight: 700;">🎨 Màu sắc chủ đề bộ từ</label>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 11px; color: var(--text-muted);">Tùy chỉnh:</span>
              <input type="color" id="deck-custom-color-input" value="#6366f1" oninput="selectDeckCustomColor(this.value)" style="width: 28px; height: 28px; border: none; border-radius: 50%; cursor: pointer; padding: 0; background: transparent; vertical-align: middle;">
            </div>
          </div>
          <div id="deck-color-palette" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; padding: 8px; background: rgba(0,0,0,0.15); border-radius: 10px; border: 1px solid var(--border);">
            <!-- Populated dynamically by renderDeckColorPalette() -->
          </div>
          <input type="hidden" id="deck-selected-color" value="#6366f1">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-deck')">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu bộ từ</button>
        </div>
      </form>
    </div>
  </div>
