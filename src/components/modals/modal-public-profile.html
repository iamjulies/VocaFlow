  <div class="modal-overlay" id="modal-public-profile" style="z-index: 10005;">
    <div class="modal ig-profile-modal">
      <!-- INSTAGRAM HEADER BAR -->
      <div class="ig-profile-header">
        <div class="ig-profile-handle-title">
          <span style="font-size: 18px;">👤</span>
          <span id="pub-view-handle" style="font-family: monospace; font-size: 15.5px; font-weight: 800; color: var(--text);">@member</span>
          <span id="pub-view-badge" class="badge" style="font-size: 10px; padding: 1px 6px; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3);">🌟 Tác Giả Đóng Góp</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="btn btn-outline btn-icon" onclick="closeModal('modal-public-profile')"><svg class="icon"><use href="#i-close"/></svg></button>
        </div>
      </div>

      <!-- MAIN SCROLLABLE BODY -->
      <div class="ig-profile-body">

        <!-- INSTAGRAM HERO SECTION: AVATAR + 3 STATS COLUMNS -->
        <div class="ig-hero-row">
          <div class="ig-avatar-ring-container">
            <div id="pub-view-avatar" class="ig-avatar-ring" style="cursor: default;">
              <div class="ig-avatar-inner">👤</div>
            </div>
          </div>

          <!-- 3 STATS COLUMNS (Instagram Standard) -->
          <div class="ig-stats-row">
            <div class="ig-stat-col" id="pub-view-stat-decks-col" onclick="switchPubProfileTab('decks')" title="Xem danh sách VocaDecks chia sẻ">
              <span class="ig-stat-number" id="pub-view-stat-decks-num">0</span>
              <span class="ig-stat-label">VocaDecks</span>
            </div>
            <div class="ig-stat-col" id="pub-view-follower-col" title="Số người đang theo dõi Flower này">
              <span class="ig-stat-number" id="pub-view-follower-count">0</span>
              <span class="ig-stat-label">Followers</span>
            </div>
            <div class="ig-stat-col" id="pub-view-following-col" title="Số người Flower này đang theo dõi">
              <span class="ig-stat-number" id="pub-view-following-count">0</span>
              <span class="ig-stat-label">Following</span>
            </div>
          </div>
        </div>

        <!-- BIO & IDENTITY BLOCK -->
        <div class="ig-bio-block">
          <div class="ig-bio-name-row">
            <span class="ig-bio-name" id="pub-view-name">Flower VocaFlow</span>
            <span id="pub-view-sub-badge" class="badge" style="font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: rgba(16, 185, 129, 0.15); color: #34d399; font-weight: 700; border: 1px solid rgba(16, 185, 129, 0.3);">🎓 Flower VocaFlow</span>
          </div>
          <div id="pub-view-bio-text" class="ig-bio-text" style="display: none;"></div>

          <!-- INFO CHIPS ROW -->
          <div class="ig-chips-row">
            <span class="ig-chip chip-coin" title="Số dư VoCoin">💰 <span id="pub-view-stat-points">0 VoCoin</span></span>
            <span class="ig-chip chip-flow" title="Chuỗi ngày học liên tục">🌊 <span id="pub-view-stat-flow">0 Ngày</span></span>
            <span class="ig-chip" title="Tổng số từ vựng chia sẻ">📝 <span id="pub-view-stat-words">0 từ</span></span>
          </div>
        </div>

        <!-- ACTION BUTTONS ROW (INSTAGRAM STYLE) -->
        <div class="ig-actions-row">
          <button type="button" id="btn-pub-follow" class="ig-btn ig-btn-primary" onclick="handlePubViewFollowToggle()" style="flex: 1.2;">
            <span>➕</span> Theo dõi
          </button>
          <button type="button" class="ig-btn ig-btn-outline" onclick="sharePublicProfile()" title="Chia sẻ hồ sơ cá nhân">
            <span>🔗</span> Chia Sẻ
          </button>
        </div>

        <!-- STORY HIGHLIGHTS: 3 PINNED BADGES (Instagram Highlights Row) -->
        <div id="pub-view-badges-container" style="margin-bottom: 14px; display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">🎖️ Danh Hiệu Nổi Bật (Highlights)</span>
          </div>
          <div id="pub-view-badges-showcase" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
            <!-- Populated dynamically -->
          </div>
        </div>

        <!-- INSTAGRAM TABS BAR -->
        <div class="ig-tabs-bar">
          <button type="button" class="ig-tab-btn active" id="pub-tab-btn-decks" onclick="switchPubProfileTab('decks')">
            <span>📑</span> <span>VocaDecks</span>
          </button>
          <button type="button" class="ig-tab-btn" id="pub-tab-btn-stats" onclick="switchPubProfileTab('stats')">
            <span>📊</span> <span>Chỉ Số</span>
          </button>
        </div>

        <!-- TAB PANEL 1: DECKS LIST -->
        <div id="pub-tab-panel-decks">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">VocaDecks đã chia sẻ:</span>
            <span id="pub-view-decks-count" style="font-size: 11.5px; font-weight: 700; color: #818cf8;"></span>
          </div>
          <div id="pub-view-decks-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto;">
            <!-- Populated dynamically -->
          </div>
        </div>

        <!-- TAB PANEL 2: STATS -->
        <div id="pub-tab-panel-stats" style="display: none;">
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
            <div style="background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; text-align: center;">
              <div style="font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px;">💰 Ví VoCoin</div>
              <div id="pub-view-stat-points-card" style="font-size: 16px; font-weight: 800; color: #fbbf24;">0 VoCoin</div>
            </div>
            <div style="background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; text-align: center;">
              <div style="font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px;">🌊 FlowStreak</div>
              <div id="pub-view-stat-flow-card" style="font-size: 16px; font-weight: 800; color: #22d3ee;">0 Ngày</div>
            </div>
            <div style="background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; text-align: center;">
              <div style="font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px;">📚 VocaDecks</div>
              <div id="pub-view-stat-decks" style="font-size: 16px; font-weight: 800; color: #818cf8;">0 bộ</div>
            </div>
            <div style="background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 12px 10px; text-align: center;">
              <div style="font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px;">📝 Tổng từ vựng</div>
              <div id="pub-view-stat-words-card" style="font-size: 16px; font-weight: 800; color: #34d399;">0 từ</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
