<!-- MODAL: DICTATION RESULT CELEBRATION (v0.10.10-21 VIP β) -->
<div class="modal-overlay" id="modal-dictation-result">
  <div class="modal" style="max-width: 520px; text-align: center;">
    <div style="font-size: 48px; margin-bottom: 8px; animation: bounce 0.6s ease;">🎉</div>
    <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 4px; color: var(--text);">Hoàn Thành Bài Luyện Nghe Gõ Câu!</h2>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Bạn đã xuất sắc hoàn thành buổi luyện nghe chép câu chuẩn xác</p>

    <!-- STATS SUMMARY CARDS -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px;">
      <div style="background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px;">
        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 2px;">Số câu luyện</div>
        <strong id="dictation-res-total-count" style="font-size: 16px; color: var(--text);">0 câu</strong>
      </div>
      <div style="background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px;">
        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 2px;">Độ chính xác</div>
        <strong id="dictation-res-accuracy" style="font-size: 16px; color: #34d399;">100%</strong>
      </div>
      <div style="background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px;">
        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 2px;">Thưởng Xu</div>
        <strong id="dictation-res-coins" style="font-size: 16px; color: #fbbf24;">+0 Xu</strong>
      </div>
    </div>

    <!-- MISTAKES SUMMARY (If any) -->
    <div id="dictation-res-mistakes-container" style="display: none; text-align: left; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 12px; padding: 10px 14px; margin-bottom: 18px;">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #f87171; margin-bottom: 6px;">
        <span>📕 Các từ cần chú ý (Đã thêm vào Sổ tay từ sai):</span>
      </div>
      <div id="dictation-res-mistakes-list" style="font-size: 12px; color: var(--text); display: flex; flex-wrap: wrap; gap: 6px;"></div>
    </div>

    <div class="modal-actions" style="margin-top: 10px; display: flex; gap: 10px;">
      <button class="btn btn-outline" onclick="closeDictationResultModal()" style="flex: 1; font-weight: 700;">
        Về Bộ Từ
      </button>
      <button class="btn btn-primary" onclick="closeDictationResultModal(); openDictationSetupModal(dictationSetupUseSelection, dictationSetupCustomWordList);" style="flex: 1.5; background: linear-gradient(135deg, #8b5cf6, #6d28d9); border: none; font-weight: 700;">
        🔄 Luyện Tập Lại
      </button>
    </div>
  </div>
</div>
