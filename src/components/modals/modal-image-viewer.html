  <!-- MODAL: FULLSCREEN IMAGE VIEWER / LIGHTBOX (v0.10.9-53) -->
  <div class="image-viewer-modal-overlay" id="modal-image-viewer" onclick="handleImageViewerBackdropClick(event)">
    <!-- TOP HEADER BAR -->
    <div class="image-viewer-header">
      <div class="image-viewer-title" id="image-viewer-title">Ảnh bài viết VocaCommunity</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button type="button" class="image-viewer-btn" onclick="copyImageViewerLink()" title="Sao chép liên kết ảnh">
          <span>📋</span> Sao chép link
        </button>
        <button type="button" class="image-viewer-btn" onclick="downloadImageViewerImage()" title="Tải ảnh về máy" style="color: #38bdf8; border-color: rgba(56,189,248,0.4);">
          <span>💾</span> Tải về
        </button>
        <button type="button" class="btn btn-outline btn-icon" onclick="closeImageViewerModal()" style="border-radius: 50%; width: 36px; height: 36px; color: #fff; border-color: rgba(255,255,255,0.3); background: rgba(0,0,0,0.5);">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>
    </div>

    <!-- MAIN IMAGE STAGE (ZOOM & PAN) -->
    <div class="image-viewer-stage" id="image-viewer-stage" onmousedown="startImageViewerDrag(event)" onmousemove="onImageViewerDrag(event)" onmouseup="endImageViewerDrag()" onmouseleave="endImageViewerDrag()" onwheel="onImageViewerWheel(event)">
      <img id="image-viewer-img" class="image-viewer-img" src="" alt="VocaFlow Post Image" draggable="false">
    </div>

    <!-- BOTTOM FLOATING CONTROLS BAR -->
    <div class="image-viewer-bottom-bar">
      <button type="button" class="image-viewer-btn" onclick="zoomImageViewer(0.25)" title="Phóng to (+)">
        <span>➕</span> Phóng to
      </button>
      <span id="image-viewer-zoom-level" style="font-size: 11.5px; font-weight: 700; color: #38bdf8; min-width: 45px; text-align: center;">100%</span>
      <button type="button" class="image-viewer-btn" onclick="zoomImageViewer(-0.25)" title="Thu nhỏ (-)">
        <span>➖</span> Thu nhỏ
      </button>
      <button type="button" class="image-viewer-btn" onclick="rotateImageViewer(90)" title="Xoay ảnh 90°">
        <span>🔄</span> Xoay
      </button>
      <button type="button" class="image-viewer-btn" onclick="resetImageViewer()" title="Khôi phục kích thước gốc">
        <span>⏪</span> Khôi phục
      </button>
    </div>
  </div>
